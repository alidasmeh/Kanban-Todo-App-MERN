<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf8ff;
        }
        .soft-float {
            box-shadow: 0px 1px 3px rgba(0,0,0,0.05), 0px 4px 6px rgba(0,0,0,0.02);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-6">
<!-- Login Container -->
<div class="w-full max-w-[440px] flex flex-col gap-8">
<!-- Branding Header -->
<div class="flex flex-col items-center text-center gap-2">
<div class="flex items-center gap-3 mb-2">
<div class="bg-primary p-2 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[28px]" data-icon="rocket_launch">rocket_launch</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Kinetic Board</h1>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please enter your details to access your workspace.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl soft-float p-8 border border-outline-variant/30">
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface text-on-surface font-body-base text-body-base border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-surface text-on-surface font-body-base text-body-base border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none" for="remember">Remember this device</label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-lg shadow-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Social Login Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container-lowest px-2 text-on-surface-variant font-label-sm">Or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 border border-outline-variant rounded-lg font-body-sm text-on-surface hover:bg-surface-container-low transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="The colorful Google logo icon rendered in high resolution for a digital interface. The aesthetic is clean and corporate, fitting perfectly within a professional productivity application's login screen. The surrounding background is a crisp, sterile white to maintain a modern light-mode feel." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDsguQ0R-d4fZB1_PKSRFWF2aLV39z8tZmyJNS5_LpETpCXweGuZAu8O5dRVLnvgco4-mq-8j-t-L1AB3Q50EBlTdhbfXD22zdBjNCCN1_IzX89d_e8aeYNgsSK7cZgcd-SzMGR81Qdi-6WEeUagMkgP3JKHbdXh8TBYmWO7C7KRxRJ2RtK6DY975Y6fzbY9UhYwVEHpCMSfq_KFmC1gTh79Uuxw0BdK_AWahNw3V2drnoRC3KSodgZx6_CyKd_s-BeD0HuN_tTw"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 py-2.5 border border-outline-variant rounded-lg font-body-sm text-on-surface hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="terminal">terminal</span>
                    SSO
                </button>
</div>
</div>
<!-- Footer Links -->
<p class="text-center font-body-base text-body-base text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-bold hover:underline transition-all" href="#">Sign up</a>
</p>
<!-- Legal/Support Footer -->
<div class="flex justify-center gap-6 mt-4">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" href="#">Help Center</a>
</div>
</div>
</body></html>
