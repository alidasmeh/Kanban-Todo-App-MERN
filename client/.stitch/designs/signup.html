<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-float {
            box-shadow: 0px 1px 3px rgba(0,0,0,0.05), 0px 4px 6px rgba(0,0,0,0.02);
        }

<body class="bg-background font-body-base text-on-background min-h-screen flex items-center justify-center p-6">
<main class="w-full max-w-[440px]">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-10">
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center soft-float">
<span class="material-symbols-outlined text-white text-2xl" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface tracking-tight">Kinetic Board</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create your account</h1>
<p class="text-on-surface-variant font-body-sm text-body-sm text-center">Join the workspace for high-performance product teams.</p>
</div>
<!-- Signup Card -->
<div class="bg-surface-container-lowest soft-float rounded-lg p-10 border border-outline-variant/30">
<form action="#" class="space-y-6" method="POST">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="person">person</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3.5 pl-12 pr-4 font-body-base text-body-base focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="name" name="name" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email Address Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3.5 pl-12 pr-4 font-body-base text-body-base focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3.5 pl-12 pr-12 font-body-base text-body-base focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="confirm-password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3.5 pl-12 pr-4 font-body-base text-body-base focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-label-md text-body-base py-4 rounded-lg soft-float hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-8 border-t border-outline-variant/50 flex flex-col gap-4">
<button class="w-full flex items-center justify-center gap-3 py-3 border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface hover:bg-surface-container transition-colors">
<img alt="Google Logo" class="w-4 h-4" data-alt="The iconic Google G logo in its original brand colors of blue, red, yellow, and green, rendered in a clean and flat minimalist style for a professional UI integration. The lighting is even and bright, conveying a sense of modern accessibility and trusted digital authentication within a high-end enterprise software application context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzpG2p-Ho3XYbZcRrv5g8E3SaXUmVLBl93otwZBBiOZrUfv_N69l0D7SDKP64y8gWxh58orUNnGN0RcX_iNFTzio3BeD6w-2sJUKmAfnPbYgehw5MhGxOeZZTJ4SBNCekb_rHQdqJEMYejulnaHe6F6OH8TZPQeTElxrQNpIDx2a-MtyVGC4Ku5GUEfjm3d9PtoMouW8yQ8e8ur7X-CWJtuGlUDKeaJG9eZU9CbVLh_KHZtFWgtOJdHfoOOiiCHkufjogcKhDGRw"/>
                    Continue with Google
                </button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Sign in</a>
</p>
</div>
<!-- Decorative elements to match Corporate/Modern aesthetic -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[30%] h-[30%] bg-secondary/5 blur-[100px] rounded-full"></div>
</div>
</main>
</body></html>
